name = "Accrued liabilities"
concepts = ["AccruedLiabilitiesCurrent"]
labels = ["accrued (expenses|liabilities)( and other current liabilities)?"]

[deferred_tax_liabilities]
statement = "BS"
name = "Deferred tax liabilities"
concepts = ["DeferredIncomeTaxLiabilitiesNet", "DeferredTaxLiabilitiesNoncurrent"]
labels = ["deferred (income )?tax liabilit(y|ies)(, net)?"]

[other_liabilities_noncurrent]
statement = "BS"
name = "Other non-current liabilities"
concepts = ["OtherLiabilitiesNoncurrent"]
labels = ["other (long-term|non-?current) liabilities"]

[common_stock]
statement = "BS"
name = "Common stock (par value)"
concepts = ["CommonStockValue"]
labels = []

[aoci]
statement = "BS"
name = "Accumulated other comprehensive income"
concepts = ["AccumulatedOtherComprehensiveIncomeLossNetOfTax"]
labels = ["accumulated other comprehensive (income|loss|income \\(loss\\)|\\(loss\\) income)"]

[nci]
statement = "BS"
name = "Non-controlling interests"
concepts = ["MinorityInterest"]
labels = ["non-?controlling interests?"]

[sbc]
statement = "CF"
name = "Stock-based compensation"
concepts = ["ShareBasedCompensation", "AllocatedShareBasedCompensationExpense"]
labels = []

[d_and_a]
statement = "CF"
name = "Depreciation & amortization"
concepts = ["DepreciationDepletionAndAmortization", "DepreciationAndAmortization", "Depreciation"]
labels = []

[deferred_tax_expense]
statement = "CF"
