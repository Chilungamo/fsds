# Canonical chart of accounts (design doc §7).
#
# Each [item] maps company-specific reporting onto one line the dashboard and the
# propagation engine understand.
#   statement  IS | BS | CF
#   name       display name
#   concepts   us-gaap / srt local names, most preferred first (the first one reported wins)
#   labels     regular expressions (case-insensitive, matched against the whole
#              normalised row label) for HTML tables without XBRL tags
#
# Values keep XBRL's natural signs: expenses and outflows are positive numbers.

# --- income statement -------------------------------------------------------------

[revenue]
statement = "IS"
name = "Revenue"
concepts = [
  "Revenues",
  "RevenueFromContractWithCustomerExcludingAssessedTax",
  "RevenueFromContractWithCustomerIncludingAssessedTax",
  "SalesRevenueNet",
  "RevenuesNetOfInterestExpense",
]
labels = [
  "(total )?(net )?revenues?(, net)?",
  "total (net )?revenues? and other income",
  "(total )?net sales",
  "sales(, net)?",
  "revenues? from .*",
]

[cogs]
statement = "IS"
name = "Cost of revenue"
concepts = ["CostOfRevenue", "CostOfGoodsAndServicesSold", "CostOfGoodsSold", "CostOfServices"]
labels = ["(total )?cost of (revenues?|sales|goods sold|goods and services sold|services)"]

[gross_profit]
statement = "IS"
name = "Gross profit"
concepts = ["GrossProfit"]
labels = ["gross (profit|margin)( \\(loss\\))?"]

[sga]
statement = "IS"
name = "SG&A"
concepts = ["SellingGeneralAndAdministrativeExpense", "GeneralAndAdministrativeExpense"]
labels = ["selling, general,? and administrative( expenses?)?", "general and administrative( expenses?)?"]

[impairment]
statement = "IS"
name = "Impairment"
concepts = [
  "AssetImpairmentCharges",
  "GoodwillImpairmentLoss",
  "ImpairmentOfLongLivedAssetsHeldForUse",
  "GoodwillAndIntangibleAssetImpairment",
]
labels = ["(goodwill |asset )?impairment( expense| charges?| loss)?.*"]

[opex]
statement = "IS"
name = "Operating expenses"
concepts = ["OperatingExpenses", "CostsAndExpenses", "OperatingCostsAndExpenses"]
labels = ["total (operating )?(costs and )?expenses", "total operating costs and expenses"]

[operating_income]
statement = "IS"
name = "Operating income"
concepts = ["OperatingIncomeLoss"]
labels = [
  "(total )?(operating|income \\(loss\\) from operations|loss from operations|income from operations)( (income|loss))?( \\(loss\\))?",
  "operating (income|loss|\\(loss\\) income|income \\(loss\\))",
]

[warrant_fv_change]
statement = "IS"
name = "Change in fair value of warrants"
concepts = ["FairValueAdjustmentOfWarrants"]
labels = ["change in fair value of (the )?(warrant|derivative) liabilit(y|ies).*"]

[pretax_income]
statement = "IS"
name = "Pre-tax income"
concepts = [
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest",
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments",
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesDomestic",
]
labels = ["(net )?(income|loss|\\(loss\\) income|income \\(loss\\)|loss \\(income\\)) before (provision for )?income tax(es)?.*"]

[tax_expense]
statement = "IS"
name = "Income tax expense"
concepts = ["IncomeTaxExpenseBenefit"]
labels = ["(provision for |benefit from )?income tax(es)?( \\(benefit\\) expense| expense( \\(benefit\\))?| \\(expense\\) benefit| provision| benefit)?"]

[net_income]
statement = "IS"
name = "Net income"
concepts = ["NetIncomeLoss", "ProfitLoss", "NetIncomeLossAvailableToCommonStockholdersBasic"]
labels = [
  "net (income|loss|\\(loss\\) income|income \\(loss\\)|loss \\(income\\)|earnings)( for the (period|year))?",
  "(loss|income) for the (period|year)",
  "net (income|loss|income \\(loss\\)) attributable to .*",
]

[eps_basic]
statement = "IS"
name = "EPS (basic)"
concepts = ["EarningsPerShareBasic", "EarningsPerShareBasicAndDiluted"]
labels = [
  "(basic|basic and diluted)( net)? (income|loss|income \\(loss\\)|earnings|\\(loss\\) income|loss \\(income\\))? ?per (common )?share.*",
  "net (income|loss|income \\(loss\\)|\\(loss\\) income) per (common )?share.*basic.*",
  "basic( and diluted)?",
]

[eps_diluted]
statement = "IS"
name = "EPS (diluted)"
concepts = ["EarningsPerShareDiluted"]
labels = ["diluted( net)? (income|loss|earnings).*per share.*", "diluted"]

# --- balance sheet ----------------------------------------------------------------

[cash]
statement = "BS"
name = "Cash"
concepts = ["CashAndCashEquivalentsAtCarryingValue", "Cash"]
labels = ["cash( and cash equivalents)?"]

[accounts_receivable]
statement = "BS"
name = "Accounts receivable"
concepts = ["AccountsReceivableNetCurrent", "ReceivablesNetCurrent", "AccountsReceivableNet"]
labels = ["(trade )?accounts receivable(, net)?.*", "receivables(, net)?"]

[inventory]
statement = "BS"
name = "Inventory"
concepts = ["InventoryNet", "InventoryGross"]
labels = ["inventor(y|ies)(, net)?"]

[total_current_assets]
statement = "BS"
name = "Current assets"
concepts = ["AssetsCurrent"]
labels = ["total current assets"]

[ppe]
statement = "BS"
name = "Property, plant & equipment"
concepts = [
  "PropertyPlantAndEquipmentNet",
  "PropertyPlantAndEquipmentAndFinanceLeaseRightOfUseAssetAfterAccumulatedDepreciationAndAmortization",
]
labels = ["(total )?property(, plant)?,? and equipment(, net)?.*"]

[goodwill]
statement = "BS"
name = "Goodwill"
concepts = ["Goodwill"]
labels = ["goodwill"]

[intangibles]
statement = "BS"
name = "Intangible assets"
concepts = ["IntangibleAssetsNetExcludingGoodwill", "FiniteLivedIntangibleAssetsNet"]
labels = ["intangible assets(, net)?"]

[deferred_tax_assets]
statement = "BS"
name = "Deferred tax assets"
concepts = ["DeferredIncomeTaxAssetsNet", "DeferredTaxAssetsNet"]
labels = ["deferred (income )?tax assets?(, net)?"]

[total_assets]
statement = "BS"
name = "Total assets"
concepts = ["Assets"]
labels = ["total assets"]

[deferred_revenue]
statement = "BS"
name = "Deferred revenue"
concepts = [
  "ContractWithCustomerLiabilityCurrent",
  "DeferredRevenueCurrent",
  "ContractWithCustomerLiability",
  "DeferredRevenue",
]
labels = ["(current )?(deferred revenues?|contracts? liabilit(y|ies))(, current)?( portion)?"]

[warrant_liabilities]
statement = "BS"
name = "Warrant liabilities"
concepts = ["DerivativeLiabilitiesNoncurrent", "DerivativeLiabilities", "WarrantLiabilities"]
labels = ["(public and private )?(warrant|derivative) liabilit(y|ies).*"]

[total_current_liabilities]
statement = "BS"
name = "Current liabilities"
concepts = ["LiabilitiesCurrent"]
labels = ["total current liabilities"]

[total_liabilities]
statement = "BS"
name = "Total liabilities"
concepts = ["Liabilities"]
labels = ["total liabilities"]

[temporary_equity]
statement = "BS"
name = "Redeemable shares (temporary equity)"
concepts = [
  "TemporaryEquityCarryingAmountAttributableToParent",
  "TemporaryEquityCarryingAmountIncludingPortionAttributableToNoncontrollingInterests",
]
labels = [
  "(class a )?(ordinary shares|common stock|shares) subject to possible redemption.*",
  "total (mezzanine|temporary) equity",
]

[apic]
statement = "BS"
name = "Additional paid-in capital"
concepts = ["AdditionalPaidInCapital", "AdditionalPaidInCapitalCommonStock"]
labels = ["additional paid[- ]in capital"]

[retained_earnings]
statement = "BS"
name = "Retained earnings"
concepts = ["RetainedEarningsAccumulatedDeficit"]
labels = ["(retained earnings|accumulated deficit)( \\(accumulated deficit\\)| \\(deficit\\))?", "accumulated (deficit|earnings)"]

[total_equity]
statement = "BS"
name = "Total equity"
concepts = [
  "StockholdersEquity",
  "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest",
]
labels = [
  "(total )?(stockholders?|shareholders?|share ?holders?)'?s?'? (equity|deficit|equity \\(deficit\\)|deficiency|\\(deficit\\) equity).*",
  "total (equity|deficit)( \\(deficit\\))?",
  "capital deficiency",
]

[liabilities_and_equity]
statement = "BS"
name = "Total liabilities and equity"
concepts = ["LiabilitiesAndStockholdersEquity"]
labels = ["total liabilities,? (mezzanine equity |temporary equity |redeemable .* )?and (stockholders?|shareholders?)'?s?'? (equity|deficit).*"]

# --- cash flow statement -------------------------------------------------------------

[chg_accounts_receivable]
statement = "CF"
name = "Change in receivables"
concepts = ["IncreaseDecreaseInAccountsReceivable"]
labels = []

[chg_inventory]
statement = "CF"
name = "Change in inventory"
concepts = ["IncreaseDecreaseInInventories"]
labels = []

[chg_deferred_revenue]
statement = "CF"
name = "Change in deferred revenue"
concepts = ["IncreaseDecreaseInContractWithCustomerLiability", "IncreaseDecreaseInDeferredRevenue"]
labels = []

[capex]
statement = "CF"
name = "Capital expenditures"
concepts = ["PaymentsToAcquirePropertyPlantAndEquipment"]
labels = ["(purchases? of|acquisition of|payments? for) property(, plant)?,? and equipment"]

[cfo]
statement = "CF"
name = "Operating cash flow"
concepts = ["NetCashProvidedByUsedInOperatingActivities", "NetCashProvidedByUsedInOperatingActivitiesContinuingOperations"]
labels = ["net cash (provided by|used in|\\(used in\\) provided by|provided by \\(used in\\)|used by)? ?operating activities"]

[cfi]
statement = "CF"
name = "Investing cash flow"
concepts = ["NetCashProvidedByUsedInInvestingActivities", "NetCashProvidedByUsedInInvestingActivitiesContinuingOperations"]
labels = ["net cash (provided by|used in|\\(used in\\) provided by|provided by \\(used in\\)|used by)? ?investing activities"]

[cff]
statement = "CF"
name = "Financing cash flow"
concepts = ["NetCashProvidedByUsedInFinancingActivities", "NetCashProvidedByUsedInFinancingActivitiesContinuingOperations"]
labels = ["net cash (provided by|used in|\\(used in\\) provided by|provided by \\(used in\\)|used by)? ?financing activities"]

[fx_effect]
statement = "CF"
name = "FX effect on cash"
concepts = ["EffectOfExchangeRateOnCashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents", "EffectOfExchangeRateOnCashAndCashEquivalents"]
labels = []

[net_change_cash]
statement = "CF"
name = "Net change in cash"
concepts = [
  "CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsPeriodIncreaseDecreaseIncludingExchangeRateEffect",
  "CashAndCashEquivalentsPeriodIncreaseDecrease",
  "CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsPeriodIncreaseDecreaseExcludingExchangeRateEffect",
]
labels = ["net (increase|decrease|change|increase \\(decrease\\)|\\(decrease\\) increase|decrease \\(increase\\)) in cash.*"]

# --- added after the M2 enrichment run (most frequent unmapped concepts) ---------------

