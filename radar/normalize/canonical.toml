  "ComprehensiveIncomeNetOfTax",
  "ComprehensiveIncomeNetOfTaxIncludingPortionAttributableToNoncontrollingInterest",
]
labels = ["(total )?comprehensive (income|loss|income \\(loss\\)|\\(loss\\) income)"]

[prepaid_assets]
